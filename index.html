<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini フィギュアジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #fffde7, #ffeacc, #fff0e0, #ffe5d9);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .upload-box {
            background-image: repeating-linear-gradient(45deg, rgba(255,248,225,0.8) 25%, transparent 25%, transparent 75%, rgba(255,248,225,0.8) 75%, rgba(255,248,225,0.8)), repeating-linear-gradient(45deg, rgba(255,248,225,0.8) 25%, #ffffff 25%, #ffffff 75%, rgba(255,248,225,0.8) 75%, rgba(255,248,225,0.8));
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            transition: all 0.3s ease;
        }
        .upload-box.dragging {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            border-color: #FBBF24;
        }
        .banana-loader {
            animation: spin-bounce 2.5s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes spin-bounce {
            0%, 100% { transform: rotate(0) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-in-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main-card {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .sparkle {
            animation: sparkle-animation 1.5s ease-in-out infinite;
        }
        @keyframes sparkle-animation {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #ffd700;
            top: 0;
            opacity: 0;
            animation: confetti-fall 4s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotateZ(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg); opacity: 0; }
        }
    </style>
</head>
<body class="bg-yellow-50 text-gray-800 antialiased overflow-x-hidden">
    <div id="confetti-container" class="absolute top-0 left-0 w-full h-full pointer-events-none z-50"></div>
    <div class="container mx-auto px-4 py-8 md:py-12">
        <header class="text-center mb-10 md:mb-12">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-gray-800 flex items-center justify-center gap-2 sm:gap-4 fade-in-up">
                <span class="text-4xl md:text-5xl transition-transform duration-300 hover:scale-125 hover:rotate-[-25deg] cursor-default">🍌</span>
                <span class="whitespace-nowrap">Gemini フィギュアジェネレーター</span>
                <span class="text-4xl md:text-5xl transition-transform duration-300 hover:scale-125 hover:rotate-[25deg] cursor-default">🍌</span>
            </h1>
            <p class="mt-4 text-md md:text-lg text-amber-800 max-w-2xl mx-auto fade-in-up" style="animation-delay: 0.2s;">
                アップロードした写真が、本物みたいなフィギュアに変身！
            </p>
        </header>
        
        <main class="main-card max-w-4xl mx-auto bg-white/80 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-xl mb-12 fade-in-up" style="animation-delay: 0.4s;">
            <!-- Step 1: Upload -->
            <div id="upload-section">
                <h2 class="text-2xl font-bold text-center mb-6 text-gray-700">さあ、やってみよう！</h2>
                <div id="upload-box" class="upload-box relative border-2 border-dashed border-amber-300 rounded-2xl p-8 text-center cursor-pointer hover:border-amber-400">
                    <input type="file" id="image-upload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/png, image/jpeg, image/webp" multiple>
                    <div class="flex flex-col items-center justify-center space-y-4">
                         <svg class="w-16 h-16 text-amber-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 L 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                        </svg>
                        <p class="text-gray-600">
                            <span class="font-semibold text-amber-600">クリックしてアップロード</span> または ドラッグ＆ドロップ
                        </p>
                        <p class="text-sm text-gray-500">複数選択可 (PNG, JPG, WEBP / 各10MBまで)</p>
                    </div>
                </div>
            </div>

            <!-- Preview and Generate Button -->
            <div id="preview-section" class="hidden mt-8">
                <h2 class="text-xl font-semibold mb-4 text-center">プレビュー</h2>
                <div id="preview-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mb-6 max-h-64 overflow-y-auto bg-gray-50 p-3 rounded-lg">
                    <!-- Preview images will be injected here by JS -->
                </div>
                <div class="text-center">
                    <button id="generate-button" class="bg-gradient-to-r from-yellow-400 to-amber-500 text-white font-bold py-3 px-10 rounded-full shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-400 transition-all duration-300 ease-in-out transform hover:scale-110 hover:-rotate-2 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none">
                        <span id="generate-button-text">フィギュアを生成する</span>
                    </button>
                </div>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="hidden mt-8 text-center">
                <div id="loading-indicator">
                    <div class="flex flex-col items-center justify-center p-6 space-y-4">
                        <div class="banana-loader text-6xl">
                            <span>🍌</span>
                        </div>
                        <p class="text-gray-600">AIがフィギュアを生成中です... これには1分ほどかかる場合があります。</p>
                    </div>
                </div>
                <div id="result-content" class="hidden">
                    <h2 class="text-2xl font-bold mb-6 text-gray-700 flex justify-center items-center gap-2">
                        <span class="sparkle text-4xl" style="animation-delay: 0s;">✨</span>
                        <span>完成！</span>
                        <span class="sparkle text-4xl" style="animation-delay: 0.3s;">✨</span>
                    </h2>
                    <div id="result-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        <!-- Result cards will be injected here by JS -->
                    </div>
                     <div class="mt-8">
                        <button id="reset-button" class="text-gray-600 font-semibold py-2 px-6 rounded-full hover:bg-gray-200 transition">
                           もう一度試す
                       </button>
                    </div>
                </div>
            </div>
            
            <div id="error-message" class="hidden mt-6 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg" role="alert">
                <p class="font-bold">おっと！エラーです</p>
                <p id="error-text"></p>
            </div>
        </main>
    </div>

    <script>
        const uploadBox = document.getElementById('upload-box');
        const imageUpload = document.getElementById('image-upload');
        const previewSection = document.getElementById('preview-section');
        const previewGrid = document.getElementById('preview-grid');
        const generateButton = document.getElementById('generate-button');
        const generateButtonText = document.getElementById('generate-button-text');
        const resultSection = document.getElementById('result-section');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultContent = document.getElementById('result-content');
        const resultGrid = document.getElementById('result-grid');
        const resetButton = document.getElementById('reset-button');
        const uploadSection = document.getElementById('upload-section');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const confettiContainer = document.getElementById('confetti-container');

        let uploadedImages = [];

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => uploadBox.addEventListener(eventName, preventDefaults, false));
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        ['dragenter', 'dragover'].forEach(eventName => uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragging'), false));
        ['dragleave', 'drop'].forEach(eventName => uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragging'), false));

        uploadBox.addEventListener('drop', e => handleFiles(e.dataTransfer.files), false);
        imageUpload.addEventListener('change', e => handleFiles(e.target.files));

        async function handleFiles(files) {
            if (files.length === 0) return;
            uploadedImages = [];
            previewGrid.innerHTML = '';
            errorMessage.classList.add('hidden');

            const filePromises = Array.from(files).map(file => {
                return new Promise((resolve, reject) => {
                    if (!file.type.startsWith('image/')) {
                        return reject('画像ファイルのみアップロードできます。');
                    }
                    if (file.size > 10 * 1024 * 1024) {
                        return reject('ファイルサイズは10MB以下にしてください。');
                    }
                    const reader = new FileReader();
                    reader.onload = e => {
                        uploadedImages.push(e.target.result);
                        const imgWrapper = document.createElement('div');
                        imgWrapper.className = "aspect-square p-1 bg-white rounded-lg shadow";
                        imgWrapper.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-md">`;
                        previewGrid.appendChild(imgWrapper);
                        resolve();
                    };
                    reader.onerror = () => reject('ファイルの読み込みに失敗しました。');
                    reader.readAsDataURL(file);
                });
            });

            try {
                await Promise.all(filePromises);
                uploadSection.classList.add('hidden');
                previewSection.classList.remove('hidden');
                resultSection.classList.add('hidden');
                generateButtonText.textContent = `${uploadedImages.length}枚のフィギュアを生成する`;
            } catch (error) {
                showError(error);
                uploadedImages = [];
                previewGrid.innerHTML = '';
            }
        }
        
        function base64ToBlob(base64, mimeType = 'image/png') {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mimeType });
        }
        
        generateButton.addEventListener('click', generateAllImages);

        async function generateAllImages() {
            if (uploadedImages.length === 0) {
                showError('まず画像をアップロードしてください。');
                return;
            }
            showLoading(true);
            generateButton.disabled = true;
            resultGrid.innerHTML = '';

            let successCount = 0;
            const totalCount = uploadedImages.length;

            for (let i = 0; i < totalCount; i++) {
                loadingIndicator.querySelector('p').textContent = `AIがフィギュアを生成中です (${i + 1}/${totalCount})... これには1分ほどかかる場合があります。`;
                try {
                    const imageUrl = await generateSingleImageWithRetry(uploadedImages[i]);
                    renderResultCard(imageUrl);
                    successCount++;
                } catch (error) {
                    console.error(`Image ${i + 1} generation failed:`, error);
                    renderErrorCard();
                }
            }

            loadingIndicator.querySelector('p').textContent = `AIがフィギュアを生成中です... これには1分ほどかかる場合があります。`;
            
            if (successCount > 0) {
                showLoading(false);
            } else {
                showError('すべての画像の生成に失敗しました。');
                resultSection.classList.add('hidden');
                previewSection.classList.remove('hidden');
            }
            generateButton.disabled = false;
        }

        async function generateSingleImageWithRetry(base64ImageData) {
            return new Promise(async (resolve, reject) => {
                for (let i = 0; i < 3; i++) {
                    try {
                        const imageUrl = await callGenerativeApi(base64ImageData);
                        resolve(imageUrl);
                        return;
                    } catch (error) {
                        console.error(`Attempt ${i + 1} for an image failed:`, error);
                        if (i === 2) {
                            reject(new Error('画像の生成に失敗しました。'));
                        } else {
                            await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000));
                        }
                    }
                }
            });
        }

        async function callGenerativeApi(base64ImageData) {
            const prompt = `写真のキャラクターを、リアルなスタイルで1/7スケールの商品フィギュアとして生成します。フィギュアは、シンプルな透明の円形ベースの上に置かれ、机の上にあります。その隣にはおもちゃのパッケージ箱があります。背景はおしゃれなリビングです。インスタグラムの投稿に適した1:1の正方形のアスペクト比で画像を生成してください。`;
            const base64DataWithoutPrefix = base64ImageData.split(',')[1];
            const payload = {
                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: base64ImageData.split(';')[0].split(':')[1], data: base64DataWithoutPrefix } }] }],
                generationConfig: { responseModalities: ['TEXT', 'IMAGE'] },
            };
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API request failed with status ${response.status}`);
            const result = await response.json();
            const generatedBase64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
            if (!generatedBase64Data) throw new Error('APIからの応答に画像データが含まれていませんでした。');

            const imageBlob = base64ToBlob(generatedBase64Data, 'image/png');
            return URL.createObjectURL(imageBlob);
        }

        function renderResultCard(imageUrl) {
            const card = document.createElement('div');
            card.className = "bg-white/50 p-4 rounded-xl shadow-lg flex flex-col items-center gap-4";
            card.innerHTML = `
                <img src="${imageUrl}" alt="生成されたフィギュア画像" class="w-full object-cover rounded-lg shadow-md aspect-square">
                <div class="flex items-center justify-center gap-3 w-full">
                    <a href="${imageUrl}" download="gemini-figure-${Date.now()}.png" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-full hover:bg-green-600 transition-transform transform hover:scale-105 flex items-center gap-2 flex-grow justify-center text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>保存</span>
                    </a>
                    <button class="share-x-button bg-black text-white font-semibold py-2 px-4 rounded-full hover:bg-gray-800 transition-transform transform hover:scale-105 flex items-center gap-2 flex-grow justify-center text-sm">
                        <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
                        <span>シェア</span>
                    </button>
                </div>
            `;
            resultGrid.appendChild(card);
        }

        function renderErrorCard() {
            const card = document.createElement('div');
            card.className = "bg-red-50 p-4 rounded-xl shadow-lg flex flex-col items-center justify-center gap-4 aspect-square";
            card.innerHTML = `
                <svg class="w-12 h-12 text-red-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                </svg>
                <p class="text-red-600 font-semibold">生成失敗</p>
                <p class="text-xs text-red-500">この画像の生成中に<br>エラーが発生しました。</p>
            `;
            resultGrid.appendChild(card);
        }

        resultGrid.addEventListener('click', (e) => {
            const shareButton = e.target.closest('.share-x-button');
            if (shareButton) {
                const shareText = "Geminiフィギュアジェネレーターで素敵な画像を作ったよ！ #Geminiフィギュア #AIアート";
                const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
                window.open(xUrl, '_blank');
            }
        });

        function showLoading(isLoading) {
            previewSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            if (isLoading) {
                loadingIndicator.classList.remove('hidden');
                resultContent.classList.add('hidden');
            } else {
                loadingIndicator.classList.add('hidden');
                resultContent.classList.remove('hidden');
                resultContent.classList.add('fade-in-up');
                launchConfetti();
            }
        }

        function launchConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                const colors = ['#ffc107', '#ffeb3b', '#fff176'];
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.height = `${Math.random() * 15 + 10}px`;
                confetti.style.width = `${Math.random() * 5 + 5}px`;
                confettiContainer.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        resetButton.addEventListener('click', () => {
            uploadedImages = [];
            imageUpload.value = '';
            previewGrid.innerHTML = '';
            resultGrid.innerHTML = '';
            uploadSection.classList.remove('hidden');
            previewSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            errorMessage.classList.add('hidden');
            generateButton.disabled = false;
            resultContent.classList.remove('fade-in-up');
            generateButtonText.textContent = 'フィギュアを生成する';
        });
    </script>
</body>
</html>
